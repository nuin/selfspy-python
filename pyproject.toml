[project]
name = "selfspy"
version = "1.0.0"
description = "Modern Python activity monitoring inspired by the original Selfspy, with real-time TUI, session tracking, and productivity insights"
authors = [
    {name = "nuin", email = "nuin@genedrift.org"},
    {name = "Bjarte Johansen (original Selfspy)"},
    {name = "David Fendrich (original Selfspy)"}
]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
keywords = [
    "activity-monitor",
    "productivity",
    "analytics",
    "keystroke-logger",
    "time-tracking",
    "session-tracking",
    "tui",
    "macos"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "SQLAlchemy>=2.0.25",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "pynput>=1.7.6",
    "cryptography>=41.0.7",
    "keyring>=24.3.0",
    "python-dateutil>=2.8.2",
    "typer>=0.9.0",
    "appdirs>=1.4.4",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "plotly>=5.18.0",
    "pandas>=2.1.4",
    "pydantic-settings>=2.1.0",
    "greenlet>=3.0.1",
    "aiofiles>=23.2.0",
    "pycryptodome>=3.19.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-Quartz",
    "pyobjc-framework-ApplicationServices",
]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "mypy>=1.8.0",
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/nuin/selfspy-python"
Repository = "https://github.com/nuin/selfspy-python"
Issues = "https://github.com/nuin/selfspy-python/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "mypy>=1.8.0",
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
]

[project.scripts]
selfspy = "src.cli:app"
selfstats = "src.stats:app"
selfviz = "src.enhanced_stats:app"
selfterminal = "src.terminal_stats:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=src"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in defaults (Typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts allowed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ApplicationServices.*",
    "Foundation.*",
    "AppKit.*",
    "Quartz.*",
    "AVFoundation.*",
    "objc.*",
    "pynput.*",
    "Crypto.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false